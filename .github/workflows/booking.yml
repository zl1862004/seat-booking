name: 每日座位预约

on:
  schedule:
    # 提前启动容器，脚本会sleep到北京时间00:00:00秒发
    # cron延迟通常30-60分钟，设23:00大概率23:30-00:00之间启动
    - cron: '0 15 * * *'   # UTC 15:00 = 北京 23:00
  workflow_dispatch:

jobs:
  book-seat:
    runs-on: ubuntu-latest
    concurrency:
      group: seat-booking
      cancel-in-progress: false
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run booking script (零点秒发版)
        env:
          STU_ID: ${{ secrets.STU_ID }}
          STU_NAME: ${{ secrets.STU_NAME }}
        run: python3 main.py
